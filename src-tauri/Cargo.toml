[package]
name = "linguadock"
version = "1.0.4"
description = "A privacy-aware adaptive four-language desktop translation dock"
authors = ["PascalePaF"]
edition = "2021"
license = "MIT"
repository = "https://github.com/PascalePaF/LinguaDock"

[lib]
name = "linguadock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures = "0.3"
ferrous-opencc = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "4.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
win_ocr = "0.1.3"
windows = { version = "0.51.1", features = ["Foundation_Collections", "Globalization", "Media_Ocr", "Win32_System_DataExchange"] }
xcap = "0.9.8"
