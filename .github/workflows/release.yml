name: Windows build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build

      - name: Assemble installer and portable package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path release, release/portable, release/portable/docs, release/portable/examples | Out-Null
          Copy-Item src-tauri/target/release/linguadock.exe release/portable/LinguaDock.exe
          Copy-Item README.md, README_EN.md, CHANGELOG.md, LICENSE, THIRD_PARTY_NOTICES.md release/portable/
          Copy-Item docs/offline-engines.md, docs/dictionary-import.md, docs/ai-providers.md, docs/youdao-experience-study.md, docs/preview.png release/portable/docs/
          Copy-Item examples/sample-dictionary.csv release/portable/examples/
          Compress-Archive -Path release/portable/* -DestinationPath release/LinguaDock_${version}_windows_x64_portable.zip
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          $signatureFile = Get-Item "$($installer.FullName).sig"
          Copy-Item $installer.FullName release/
          Copy-Item $signatureFile.FullName release/

          $releaseInstaller = Get-Item "release/$($installer.Name)"
          $latest = [ordered]@{
            version = $version
            notes = '新增词库、收藏、历史、朗读与剪贴板快译，支持 DeepSeek、千问、OpenRouter、OpenAI 多服务商 AI 接口，并可只读检测本机有道离线资源。'
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $signatureFile.FullName -Raw).Trim()
                url = "https://github.com/PascalePaF/LinguaDock/releases/download/${{ github.ref_name }}/$($releaseInstaller.Name)"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 release/latest.json

          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinguaDock-windows-x64
          path: |
            release/*.exe
            release/*.sig
            release/*.zip
            release/latest.json
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## LinguaDock ${{ github.ref_name }}

            Windows x64 正式版：把网易有道式的高频桌面翻译工作流收拢成一个无会员、无广告、无信息流的极简小窗。

            - “翻译 / 词库 / 收藏 / 历史”四区工作台，以及朗读和全部复制
            - CSV、TSV、JSON、XML、TXT、StarDict 和有道个人单词本导入
            - DeepSeek、通义千问、OpenRouter、OpenAI 与自定义 AI 接口
            - 每家服务商的密钥独立保存到 Windows 凭据管理器
            - 可选唤出时读取剪贴板；历史仅在本机保存并可关闭
            - 只读检测本机有道离线资源，不破解或重新分发专有词典
            - V1.0.1 及更高版本可在应用内直接安装此签名更新

            - 安装版：`LinguaDock_<版本>_x64-setup.exe`
            - 免安装版：`LinguaDock_<版本>_windows_x64_portable.zip`
            - 更新清单：`latest.json`（应用自动读取）
            - 校验文件：`SHA256SUMS.txt`

            V1.0.0 尚未内置更新模块，因此需先手动安装 V1.0.1 或更高版本；从 V1.0.1 起可在“设置 → 更新”中完成后续升级。

            首次运行时若 Windows SmartScreen 提示“未知发布者”，请核对本 Release 的 SHA-256 校验值。本版本的应用更新包带有 Tauri 签名，但尚未使用商业 Windows Authenticode 代码签名证书。
          files: |
            release/*.exe
            release/*.sig
            release/*.zip
            release/latest.json
            release/SHA256SUMS.txt
