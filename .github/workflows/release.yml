name: Windows build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows installer
        run: npm run tauri -- build

      - name: Assemble installer and portable package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path release, release/portable | Out-Null
          Copy-Item src-tauri/target/release/linguadock.exe release/portable/LinguaDock.exe
          Copy-Item README.md, README_EN.md, LICENSE, THIRD_PARTY_NOTICES.md release/portable/
          Compress-Archive -Path release/portable/* -DestinationPath release/LinguaDock_${version}_windows_x64_portable.zip
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release/
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: LinguaDock-windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## LinguaDock ${{ github.ref_name }}

            Windows x64 初始公开版本。

            - 安装版：`LinguaDock_0.1.0_x64-setup.exe`
            - 免安装版：`LinguaDock_0.1.0_windows_x64_portable.zip`
            - 校验文件：`SHA256SUMS.txt`

            首次运行时若 Windows SmartScreen 提示“未知发布者”，请核对本 Release 的 SHA-256 校验值。本版本尚未使用商业代码签名证书。
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
