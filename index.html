<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta
      name="description"
      content="LinguaDock：常驻桌面的四语 Google 翻译小窗"
    />
    <title>LinguaDock</title>
  </head>
  <body>
    <main id="app" class="app-shell">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <span class="brand-mark" aria-hidden="true">L</span>
          <div class="brand-copy" data-tauri-drag-region>
            <strong data-tauri-drag-region>LinguaDock</strong>
            <span data-tauri-drag-region>四语即译</span>
          </div>
        </div>

        <div class="window-actions">
          <button
            id="pinButton"
            class="icon-button is-active"
            type="button"
            aria-label="取消窗口置顶"
            title="取消窗口置顶"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 17v5M5 17h14M7 3h10l-1.5 6 2.5 3H6l2.5-3L7 3Z" />
            </svg>
          </button>
          <button
            id="hideButton"
            class="icon-button"
            type="button"
            aria-label="隐藏到系统托盘"
            title="隐藏到系统托盘（Esc）"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 12h12" />
            </svg>
          </button>
          <button
            id="closeButton"
            class="icon-button close-button"
            type="button"
            aria-label="隐藏到系统托盘"
            title="隐藏到系统托盘"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 7 10 10M17 7 7 17" />
            </svg>
          </button>
        </div>
      </header>

      <section class="workspace">
        <div class="intro-row">
          <div>
            <h1>输入一次，四语对照</h1>
            <p>简中 · English · 日本語 · 繁體中文</p>
          </div>
          <span id="shortcutPill" class="shortcut-pill" title="在任意应用中唤出 LinguaDock">
            <kbd>Ctrl</kbd><i>+</i><kbd>Alt</kbd><i>+</i><kbd>G</kbd>
          </span>
        </div>

        <section class="composer" aria-labelledby="composerLabel">
          <div class="composer-header">
            <label id="composerLabel" for="sourceText">原文</label>
            <div class="source-mode">
              <span class="spark" aria-hidden="true">✦</span>
              <label class="sr-only" for="sourceLanguage">来源语言</label>
              <select id="sourceLanguage" title="来源语言，默认自动识别">
                <option value="auto">自动识别</option>
                <option value="zh-CN">简体中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh-TW">繁體中文</option>
              </select>
            </div>
          </div>

          <textarea
            id="sourceText"
            maxlength="5000"
            rows="4"
            autofocus
            spellcheck="true"
            placeholder="输入或粘贴中文、英文、日文、繁体中文…"
            aria-describedby="composerHelp"
          ></textarea>

          <div class="composer-footer" id="composerHelp">
            <span><b id="characterCount">0</b> / 5000</span>
            <div class="composer-actions">
              <button id="clearButton" class="text-button" type="button" disabled>
                清空
              </button>
              <button id="translateButton" class="primary-button" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m5 12 4 4L19 6" />
                </svg>
                立即翻译
                <kbd>Ctrl ↵</kbd>
              </button>
            </div>
          </div>
        </section>

        <div id="statusRow" class="status-row" aria-live="polite">
          <span class="status-dot"></span>
          <span id="statusText">等待输入内容</span>
          <span id="providerText">Google 翻译</span>
        </div>

        <section id="resultsGrid" class="results-grid" aria-label="四语翻译结果">
          <article class="result-card language-zh-cn" data-language="zh-CN">
            <header>
              <div class="language-name">
                <span class="language-dot"></span>
                <strong>简体中文</strong>
                <span class="language-code">ZH</span>
                <span class="source-badge">原文</span>
              </div>
              <button class="copy-button" type="button" aria-label="复制简体中文" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="8" y="8" width="11" height="11" rx="2" />
                  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
                </svg>
              </button>
            </header>
            <p class="result-text is-placeholder">等待翻译…</p>
          </article>

          <article class="result-card language-en" data-language="en">
            <header>
              <div class="language-name">
                <span class="language-dot"></span>
                <strong>English</strong>
                <span class="language-code">EN</span>
                <span class="source-badge">原文</span>
              </div>
              <button class="copy-button" type="button" aria-label="复制英文" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="8" y="8" width="11" height="11" rx="2" />
                  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
                </svg>
              </button>
            </header>
            <p class="result-text is-placeholder">Waiting…</p>
          </article>

          <article class="result-card language-ja" data-language="ja">
            <header>
              <div class="language-name">
                <span class="language-dot"></span>
                <strong>日本語</strong>
                <span class="language-code">JA</span>
                <span class="source-badge">原文</span>
              </div>
              <button class="copy-button" type="button" aria-label="复制日文" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="8" y="8" width="11" height="11" rx="2" />
                  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
                </svg>
              </button>
            </header>
            <p class="result-text is-placeholder">翻訳を待っています…</p>
          </article>

          <article class="result-card language-zh-tw" data-language="zh-TW">
            <header>
              <div class="language-name">
                <span class="language-dot"></span>
                <strong>繁體中文</strong>
                <span class="language-code">繁</span>
                <span class="source-badge">原文</span>
              </div>
              <button class="copy-button" type="button" aria-label="复制繁体中文" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="8" y="8" width="11" height="11" rx="2" />
                  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
                </svg>
              </button>
            </header>
            <p class="result-text is-placeholder">等待翻譯…</p>
          </article>
        </section>

        <footer class="app-footer">
          <span>自动翻译已开启</span>
          <span class="privacy-note">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3 5 6v5c0 4.5 2.8 8.1 7 10 4.2-1.9 7-5.5 7-10V6l-7-3Z" />
              <path d="m9.5 12 1.7 1.7 3.5-3.7" />
            </svg>
            仅发送你输入的文字
          </span>
        </footer>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
