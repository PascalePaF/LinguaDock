<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="LinguaDock：简中、英语、日语与繁体中文四语 Google 翻译小窗"
    />
    <title>LinguaDock</title>
  </head>
  <body>
    <main id="app" class="app-shell">
      <header id="titlebar" class="titlebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">L</span>
          <strong>LinguaDock</strong>
        </div>

        <div class="window-actions">
          <button
            id="settingsButton"
            class="icon-button settings-button"
            type="button"
            aria-label="打开设置"
            title="设置"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.55v-.1A1.7 1.7 0 0 0 8.4 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2V9.55h.3A1.7 1.7 0 0 0 4 8.4a1.7 1.7 0 0 0-.34-1.88l-.06-.06L6.46 3.6l.06.06A1.7 1.7 0 0 0 8.4 4a1.7 1.7 0 0 0 1-.6A1.7 1.7 0 0 0 9.8 2.3V2h4.05v.3A1.7 1.7 0 0 0 15 4a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 8.4a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.3v4.05h-.3A1.7 1.7 0 0 0 19.4 15Z" />
            </svg>
            <span id="updateBadge" class="update-badge" aria-label="有可用更新" hidden></span>
          </button>
          <button
            id="themeButton"
            class="icon-button"
            type="button"
            aria-label="切换到夜间主题"
            title="切换到夜间主题"
          >
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.1 15.6A8.5 8.5 0 0 1 8.4 3.9 8.5 8.5 0 1 0 20.1 15.6Z" />
            </svg>
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.5" />
              <path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6" />
            </svg>
          </button>
          <button
            id="pinButton"
            class="icon-button is-active"
            type="button"
            aria-label="取消窗口置顶"
            title="取消窗口置顶"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 17v5M5 17h14M7 3h10l-1.5 6 2.5 3H6l2.5-3L7 3Z" />
            </svg>
          </button>
          <button
            id="closeButton"
            class="icon-button close-button"
            type="button"
            aria-label="隐藏到系统托盘"
            title="隐藏到系统托盘（Esc）"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 7 10 10M17 7 7 17" />
            </svg>
          </button>
        </div>
      </header>

      <section id="workspace" class="workspace">
        <section id="settingsPanel" class="settings-panel" aria-labelledby="settingsTitle" hidden>
          <header class="settings-header">
            <div>
              <h1 id="settingsTitle">设置</h1>
              <p>LinguaDock V<span id="currentVersion">1.0.1</span></p>
            </div>
            <button id="settingsDoneButton" class="text-button settings-done" type="button">
              完成
            </button>
          </header>

          <div class="settings-list">
            <section class="setting-block shortcut-setting" aria-labelledby="shortcutTitle">
              <div class="setting-copy">
                <h2 id="shortcutTitle">唤出快捷键</h2>
                <p>点击右侧后，同时按下 2–5 个按键</p>
              </div>
              <div class="shortcut-controls">
                <button id="shortcutRecorder" class="shortcut-recorder" type="button">
                  <span id="shortcutValue">Ctrl + Alt + G</span>
                  <small id="shortcutHint">点击录制</small>
                </button>
                <button id="shortcutResetButton" class="compact-button" type="button">恢复默认</button>
              </div>
            </section>

            <label class="setting-block toggle-setting" for="startupToggle">
              <span class="setting-copy">
                <strong>开机自启</strong>
                <small>登录 Windows 后在托盘中安静启动</small>
              </span>
              <span class="switch-control">
                <input id="startupToggle" type="checkbox" />
                <span aria-hidden="true"></span>
              </span>
            </label>

            <label class="setting-block toggle-setting" for="autoUpdateToggle">
              <span class="setting-copy">
                <strong>自动检查更新</strong>
                <small>启动时检查，发现新版后可一键安装</small>
              </span>
              <span class="switch-control">
                <input id="autoUpdateToggle" type="checkbox" />
                <span aria-hidden="true"></span>
              </span>
            </label>

            <section class="setting-block update-setting" aria-labelledby="updateTitle">
              <div class="setting-copy">
                <h2 id="updateTitle">软件更新</h2>
                <p id="updateStatus">当前为最新版本</p>
              </div>
              <button id="updateButton" class="secondary-button" type="button">检查更新</button>
              <div id="updateProgress" class="update-progress" role="progressbar" aria-label="更新下载进度" hidden>
                <span id="updateProgressBar"></span>
              </div>
            </section>
          </div>
        </section>

        <section id="composer" class="composer" aria-labelledby="composerLabel">
          <div class="composer-header">
            <label id="composerLabel" for="sourceText">原文</label>
            <label class="source-mode" for="sourceLanguage">
              <span class="sr-only">来源语言</span>
              <select id="sourceLanguage" title="选择来源语言">
                <option value="auto">自动识别</option>
                <option value="zh-CN">简体中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh-TW">繁體中文</option>
              </select>
            </label>
          </div>

          <textarea
            id="sourceText"
            maxlength="5000"
            rows="3"
            autofocus
            spellcheck="true"
            placeholder="输入或粘贴文字…"
          ></textarea>

          <div class="composer-footer">
            <span class="character-counter"><b id="characterCount">0</b> / 5000</span>
            <div class="composer-actions">
              <button id="clearButton" class="text-button" type="button" disabled>
                清空
              </button>
              <button id="translateButton" class="primary-button" type="button" disabled>
                翻译
                <kbd>Ctrl ↵</kbd>
              </button>
            </div>
          </div>
        </section>

        <div id="statusRow" class="status-row" aria-live="polite" hidden>
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText"></span>
        </div>

        <section id="resultsPanel" class="results-panel" hidden>
          <div id="resultsGrid" class="results-grid" aria-label="四语翻译结果">
            <article
              class="result-card language-zh-cn is-disabled"
              data-language="zh-CN"
              tabindex="0"
              role="button"
              aria-label="复制简体中文结果"
              aria-disabled="true"
            >
              <header>
                <div class="language-name">
                  <span class="language-dot" aria-hidden="true"></span>
                  <strong>简体中文</strong>
                  <span class="language-code">ZH</span>
                  <span class="source-badge">原文</span>
                </div>
                <svg class="copy-glyph" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="8" y="8" width="11" height="11" rx="2" />
                  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
                </svg>
              </header>
              <p class="result-text"></p>
              <div class="dictionary-senses" hidden></div>
            </article>

            <article
              class="result-card language-en is-disabled"
              data-language="en"
              tabindex="0"
              role="button"
              aria-label="复制英语结果"
              aria-disabled="true"
            >
              <header>
                <div class="language-name">
                  <span class="language-dot" aria-hidden="true"></span>
                  <strong>English</strong>
                  <span class="language-code">EN</span>
                  <span class="source-badge">原文</span>
                </div>
                <svg class="copy-glyph" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="8" y="8" width="11" height="11" rx="2" />
                  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
                </svg>
              </header>
              <p class="result-text"></p>
              <div class="dictionary-senses" hidden></div>
            </article>

            <article
              class="result-card language-ja is-disabled"
              data-language="ja"
              tabindex="0"
              role="button"
              aria-label="复制日语结果"
              aria-disabled="true"
            >
              <header>
                <div class="language-name">
                  <span class="language-dot" aria-hidden="true"></span>
                  <strong>日本語</strong>
                  <span class="language-code">JA</span>
                  <span class="source-badge">原文</span>
                </div>
                <svg class="copy-glyph" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="8" y="8" width="11" height="11" rx="2" />
                  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
                </svg>
              </header>
              <p class="result-text"></p>
              <div class="dictionary-senses" hidden></div>
            </article>

            <article
              class="result-card language-zh-tw is-disabled"
              data-language="zh-TW"
              tabindex="0"
              role="button"
              aria-label="复制繁体中文结果"
              aria-disabled="true"
            >
              <header>
                <div class="language-name">
                  <span class="language-dot" aria-hidden="true"></span>
                  <strong>繁體中文</strong>
                  <span class="language-code">繁</span>
                  <span class="source-badge">原文</span>
                </div>
                <svg class="copy-glyph" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="8" y="8" width="11" height="11" rx="2" />
                  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
                </svg>
              </header>
              <p class="result-text"></p>
              <div class="dictionary-senses" hidden></div>
            </article>
          </div>

          <section id="wordUsage" class="word-usage" aria-labelledby="usageTitle" hidden>
            <h2 id="usageTitle">常见用法</h2>
            <ul id="usageList"></ul>
          </section>
        </section>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
